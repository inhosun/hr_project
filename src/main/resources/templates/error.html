<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>오류</title>
    <style>
        body { font-family: sans-serif; max-width: 520px; margin: 80px auto; padding: 0 16px; text-align: center; }
        .status { font-size: 64px; font-weight: bold; color: #94a3b8; margin: 0; }
        .btn { padding: 8px 14px; border: 1px solid #888; background: #fff; border-radius: 4px;
               cursor: pointer; text-decoration: none; color: #222; font-size: 14px; }
    </style>
</head>
<body>
<p class="status" th:text="${status}">500</p>
<h2 th:text="${error}">Error</h2>
<p th:text="${#strings.isEmpty(message)} ? '요청을 처리하는 중 문제가 발생했습니다.' : ${message}">오류 메시지</p>
<p>
    <a href="javascript:history.back()" class="btn">뒤로 가기</a>
    <a th:href="@{/employees}" class="btn">직원 목록</a>
</p>
</body>
</html>
