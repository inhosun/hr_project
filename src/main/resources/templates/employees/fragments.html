<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<table>
    <tr>
        <!-- 정렬 가능한 표 머리글: 클릭하면 오름차순 <-> 내림차순 전환, 검색어는 유지 -->
        <th th:fragment="sortable(label, field)">
            <a th:href="@{/employees(keyword=${keyword}, sort=${field}, dir=${sort == field and dir == 'asc' ? 'desc' : 'asc'})}">
                <span th:text="${label}">이름</span>
                <span th:if="${sort == field}" th:text="${dir == 'asc'} ? '▲' : '▼'"></span>
            </a>
        </th>
    </tr>
</table>
</body>
</html>
